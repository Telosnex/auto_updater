name: Integration

on:
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  schedule:
    - cron: '13 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The example app is built with Swift Package Manager, Flutter's default
  # (Sparkle comes from auto_updater_macos's Package.swift), then its
  # integration_test runs on the macOS device. The test points the updater at
  # a local appcast with no newer version, so nothing is downloaded or
  # installed.
  desktop-macos-arm64:
    name: macOS ARM64
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
        working-directory: packages/auto_updater/example
      - name: Build the example with Swift Package Manager
        run: flutter build macos --debug
        working-directory: packages/auto_updater/example
      - uses: Telosnex/telosnex_ci_tools/actions/watch@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          working-directory: packages/auto_updater/example
          run: flutter test integration_test/auto_updater_test.dart -d macos -r expanded
