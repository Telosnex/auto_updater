name: Unit

on:
  pull_request:
    branches: [main]
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - uses: Telosnex/telosnex_ci_tools/actions/lint@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      # Generated files (first line "// GENERATED ...") keep their generator's
      # layout.
      - run: |
          git ls-files '*.dart' |
            while read -r f; do head -1 "$f" | grep -qiE '^// *generated' || echo "$f"; done |
            xargs dart format --output=none --set-exit-if-changed
      # The workspace packages depend on each other through pub.dev or
      # dependency_overrides, so each one is resolved and analyzed on its own.
      - run: |
          for dir in packages/auto_updater packages/auto_updater_macos \
              packages/auto_updater_platform_interface packages/auto_updater_windows \
              packages/auto_updater/example; do
            (cd "$dir" && flutter pub get && flutter analyze --fatal-infos)
          done
      - run: cd packages/auto_updater && flutter test -r expanded
